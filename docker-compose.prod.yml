# Production compose for VPS deployment.
# Pulls the pre-built GHCR image (works with .github/workflows/deploy-vps.yml).
# Uses the 8000:80 port mapping (container serves nginx on port 80). Adjust APP_PORT if needed.
#
# Database: PostgreSQL (MySQL sudah dihapus dari seluruh stack).

services:
    app:
        image: ${IMAGE_NAME}
        container_name: admin-panel-app
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        environment:
            APP_NAME: ${APP_NAME:-Timeless Florals}
            APP_ENV: production
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL}
            APP_KEY: ${APP_KEY}
            DB_CONNECTION: pgsql
            DB_HOST: ${DB_HOST:-postgres}
            DB_PORT: ${DB_PORT:-5432}
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_SSLMODE: ${DB_SSLMODE:-require}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            BROADCAST_CONNECTION: reverb
            REVERB_APP_ID: ${REVERB_APP_ID:-local_reverb}
            REVERB_APP_KEY: ${REVERB_APP_KEY:-local_key}
            REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local_secret}
            REVERB_HOST: ${REVERB_HOST:-localhost}
            REVERB_PORT: ${REVERB_PORT:-8080}
            REVERB_SCHEME: ${REVERB_SCHEME:-http}
            MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
            MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
            MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
            MIDTRANS_IS_SANITIZED: ${MIDTRANS_IS_SANITIZED:-true}
            MIDTRANS_IS_3DS: ${MIDTRANS_IS_3DS:-true}
        networks:
            - weeding-network
        depends_on:
            postgres:
                condition: service_healthy
    postgres:
        image: 'postgres:18-alpine'
        container_name: admin-panel-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres-db-data:/var/lib/postgresql/data
        networks:
            - weeding-network
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE}']
            retries: 5
            timeout: 5s
            interval: 5s
    adminer:
        # Pengganti phpMyAdmin (phpMyAdmin hanya melayani MySQL).
        # Pertimbangkan menonaktifkan service ini di production.
        image: 'adminer:4'
        container_name: admin-panel-adminer
        restart: unless-stopped
        ports:
            - '8081:8080'
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        networks:
            - weeding-network
        depends_on:
            - postgres
networks:
    weeding-network:
        driver: bridge
volumes:
    postgres-db-data:
        driver: local
