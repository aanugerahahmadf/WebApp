<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memuat</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1a1a1a;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      /* ═══════════════════════════════════════════════════════════════════
         SPLASH = LAYAR LOADING, bukan layar identitas.

         Yang di sini:
           1. Logo brand (tetap).
           2. PESAN LOADING yang diterjemahkan -- "Harap Tunggu" (id) /
              "Please wait" (en). Dulu di sini ditulis nama brand
              ("Dekorasi"), yang bukan information: orang yang sedang
              menunggu tidak butuh tahu nama aplikasinya, dia butuh
              tahu aplikasinya SEDANG BEKERJA.
           3. Progress bar 1 -> 100 seperti unduhan, plus angkanya.
              Spinner (lingkaran berputar) tidak memberi tahu berapa
              lama lagi; bar yang/isinya bertambah memberi tahu.

         Bahasa diambil dari `navigator.language` -- satu-satunya sinyal
         locale yang tersedia SEBELUM server dihubungi (halaman ini
         dimuat dari file://, bukan dari Laravel). Aturan locale-nya
         sama dengan `App\Support\AppLocale\AppLocale`: 'id' untuk
         shell native sebagai fallback.
         ═══════════════════════════════════════════════════════════════ */
      .splash {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      /* The brand mark. `icon.png` sits next to this file inside
         `assets/`, and the runtime loads the splash with `loadFile()`,
         so the relative path resolves to the very same file that
         electron-builder ships. */
      .splash__logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        border-radius: 20%;
        margin-bottom: 0.25rem;
      }

      .splash__message {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      /* Progress bar: track + fill. Lebar fill = persentase. */
      .splash__progress {
        position: relative;
        width: 220px;
        height: 6px;
        margin-top: 0.25rem;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e7eb;
      }

      .splash__progress-bar {
        width: 0;
        height: 100%;
        border-radius: 999px;
        background: #eab308;
        transition: width 120ms linear;
      }

      .splash__percent {
        margin: 0;
        min-height: 1rem;
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
        color: #6b7280;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a1a;
          color: #f5f5f5;
        }
        /* The logo is gold line art on a transparent background, so on a dark
         * surface it would vanish. A soft light plate keeps it readable. */
        .splash__logo {
          background: #ffffff;
          border-radius: 1rem;
          padding: 0.75rem;
          box-sizing: content-box;
        }
        .splash__progress {
          background: #374151;
        }
        .splash__percent {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img class="splash__logo" src="./icon.png" alt="" />
      <p class="splash__message" id="message">Harap Tunggu</p>

      <div
        class="splash__progress"
        id="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="1"
      >
        <div class="splash__progress-bar" id="bar"></div>
      </div>

      <p class="splash__percent"><span id="percent">1</span>%</p>
    </div>

    <script>
      (function () {
        'use strict';

        /**
         * Pesan loading sesuai bahasa.
         *
         * 'id' = "Harap Tunggu", sisanya = "Please wait".
         */
        var locale = (navigator.language || 'id').toLowerCase();
        var message = locale === 'id' || locale.indexOf('id-') === 0 ? 'Harap Tunggu' : 'Please wait';

        document.getElementById('message').textContent = message;
        document.documentElement.setAttribute('lang', locale === 'id' || locale.indexOf('id-') === 0 ? 'id' : 'en');

        var bar = document.getElementById('bar');
        var percent = document.getElementById('percent');
        var progress = document.getElementById('progress');

        /**
         * Progress 1 -> 100, seperti unduhan.
         *
         * Durasi-nya SAMAD dengan `minimumDurationMs` di
         * `capacitor.electron.config.ts` (600ms), jadi barannya habis
         * tepat waktu splash ditutup -- tidak ada angka yang menggantung
         * di 87%.
         *
         * Langkahnya tidak sama rater: cepat di awal, melambat di akhir
         * (ease-out), seperti unduhan yang sudah hampir selesai.
         *
         * Pakai `setInterval`, bukan `requestAnimationFrame`: rAF BERHENTI
         * kalau window-nya belum terlihat, jadi progress-nya bisa nyaris
         * tidak bergerak di detik pertama.
         */
        var DURATION = 600;
        var start = Date.now();

        function easeOut(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function step() {
            var elapsed = Date.now() - start;
            var ratio = Math.min(1, elapsed / DURATION);
            var value = Math.max(1, Math.min(100, Math.round(easeOut(ratio) * 100)));

            bar.style.width = value + '%';
            percent.textContent = String(value);
            progress.setAttribute('aria-valuenow', String(value));

            if (ratio >= 1) {
                clearInterval(timer);
            }
        }

        var timer = setInterval(step, 30);

        step();
      })();
    </script>
  </body>
</html>
