# Search Type Definitions
# Wedding Flower Decoration App - Search GraphQL Types

type SearchResult {
  id: ID!
  type: String!
  name: String!
  slug: String!
  price: Float
  imageUrl: String
  category: String
}

type SearchResults {
  catalogs: [Catalog!]!
  packages: [Package!]!
  categories: [Category!]!
  totalCatalogs: Int!
  totalPackages: Int!
  query: String!
  took: Float!
}

type SearchSuggestion {
  text: String!
  type: SearchSuggestionType!
  count: Int!
  imageUrl: String
}

type PopularSearch {
  query: String!
  count: Int!
  trend: String!
}

type SearchFilters {
  categories: [CategoryFilter!]!
  priceRange: PriceRange!
  themes: [String!]!
  colors: [String!]!
  minCapacity: Int
  maxCapacity: Int
}

type CategoryFilter {
  category: Category!
  count: Int!
}

type PriceRange {
  min: Float!
  max: Float!
  minFound: Float!
  maxFound: Float!
}

enum SearchSuggestionType {
  CATALOG
  PACKAGE
  CATEGORY
  KEYWORD
}