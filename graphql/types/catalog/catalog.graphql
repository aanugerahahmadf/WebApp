# Catalog Type Definition
# Wedding Flower Decoration App - Catalog GraphQL Types

type Catalog @model(class: "App\\Models\\Catalog\\Catalog") {
  id: ID!
  name: String!
  slug: String!
  description: String
  price: Float!
  discountPrice: Float
  finalPrice: Float!
  stock: Int!
  isActive: Boolean!
  isFeatured: Boolean!
  isOutOfStock: Boolean!
  imageUrl: String
  thumbnailUrl: String
  galleryUrls: [GalleryImage!]!
  videoUrl: String
  features: [String!]
  theme: String
  color: String
  minCapacity: Int
  maxCapacity: Int
  category: Category @belongsTo
  averageRating: Float
  reviews: [Review!]! @hasMany
  createdAt: String!
  updatedAt: String!
}

type GalleryImage {
  id: Int!
  url: String!
  thumb: String!
  collection: String!
  order: Int!
}

# Catalog Connection for pagination
type CatalogConnection {
  data: [Catalog!]!
  pageInfo: PageInfo!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# Catalog Filter Input
input CatalogFilter {
  categoryId: ID
  featured: Boolean
  onSale: Boolean
  minPrice: Float
  maxPrice: Float
  active: Boolean
  theme: String
  color: String
  search: String
}

# Catalog Sort Input
input CatalogSort {
  field: CatalogSortField!
  direction: SortDirection!
}

enum CatalogSortField {
  NAME
  PRICE
  CREATED_AT
  UPDATED_AT
  RATING
  POPULARITY
}

enum SortDirection {
  ASC
  DESC
}