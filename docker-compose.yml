services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: admin-panel-app
        restart: unless-stopped
        ports:
            - '8000:80'
        environment:
            - APP_NAME="Wedding Flower Decorations"
            - APP_ENV=local
            - APP_DEBUG=true
            - 'APP_URL=http://localhost:8000'
            - DOCKER_ENV=true
            # PostgreSQL satu-satunya database yang didukung.
            - DB_CONNECTION=pgsql
            - DB_HOST=postgres
            - DB_PORT=5432
            - 'DB_DATABASE=${DB_DATABASE:-admin_panel_cbir}'
            - 'DB_USERNAME=${DB_USERNAME:-postgres}'
            - 'DB_PASSWORD=${DB_PASSWORD:-password}'
            - 'DB_SSLMODE=disable'
            - SESSION_DRIVER=database
            - CACHE_STORE=database
            - QUEUE_CONNECTION=database
            - BROADCAST_CONNECTION=reverb
            - REVERB_APP_ID=local_reverb
            - REVERB_APP_KEY=local_key
            - REVERB_APP_SECRET=local_secret
            - REVERB_HOST=localhost
            - REVERB_PORT=8080
            - REVERB_SCHEME=http
        volumes:
            - './app:/var/www/html/app'
            - './bootstrap:/var/www/html/bootstrap'
            - './config:/var/www/html/config'
            - './database:/var/www/html/database'
            - './lang:/var/www/html/lang'
            - './public:/var/www/html/public'
            - './resources:/var/www/html/resources'
            - './routes:/var/www/html/routes'
            - './storage:/var/www/html/storage'
            - 'app-cache:/var/www/html/bootstrap/cache'
        networks:
            - weeding-network
        depends_on:
            postgres:
                condition: service_healthy
    postgres:
        # Samakan mayoritas dengan PostgreSQL 18 yang dipakai development
        # Laragon (lihat AGENTS.md bagian 1.1).
        image: 'postgres:18-alpine'
        container_name: admin-panel-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-admin_panel_cbir}'
            POSTGRES_USER: '${DB_USERNAME:-postgres}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        ports:
            # Host 5433 supaya tidak berebut 5432 dengan PostgreSQL Laragon.
            - '5433:5432'
        volumes:
            - 'postgres-db-data:/var/lib/postgresql/data'
        networks:
            - weeding-network
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-U'
                - '${DB_USERNAME:-postgres}'
                - '-d'
                - '${DB_DATABASE:-admin_panel_cbir}'
            retries: 5
            timeout: 5s
            interval: 5s
    adminer:
        # Pengganti phpMyAdmin: phpMyAdmin hanya melayani MySQL.
        image: 'adminer:4'
        container_name: admin-panel-adminer
        restart: unless-stopped
        ports:
            - '8081:8080'
        environment:
            ADMINER_DEFAULT_SERVER: postgres
        networks:
            - weeding-network
        depends_on:
            - postgres
networks:
    weeding-network:
        driver: bridge
volumes:
    postgres-db-data:
        driver: local
    app-cache:
        driver: local
