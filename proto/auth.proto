syntax = "proto3";

package weddingapp.auth;

option php_namespace = "App\\Grpc\\Auth";
option java_package = "com.weddingapp.auth";
option csharp_namespace = "WeddingApp.Auth";
option go_package = "github.com/weddingapp/grpc/auth";

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (LoginResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc GetProfile (GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile (UpdateProfileRequest) returns (GetProfileResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (LoginResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendVerificationEmail (ResendVerificationRequest) returns (ResendVerificationResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string device_token = 3;
  string device_type = 4;
  bool remember_me = 5;
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string password_confirmation = 4;
  string phone = 5;
  bool accept_terms = 6;
  bool marketing_consent = 7;
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  User user = 4;
  string refresh_token = 5;
  int64 refresh_expires_in = 6;
  string message = 7;
}

message LogoutRequest {
  string access_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GetProfileRequest {
  string access_token = 1;
}

message GetProfileResponse {
  User user = 1;
  UserProfile profile = 2;
}

message UpdateProfileRequest {
  string access_token = 1;
  string name = 2;
  string phone = 3;
  string address = 4;
  string city = 5;
  string province = 6;
  string postal_code = 7;
  string date_of_birth = 8;
  string gender = 9;
  string avatar = 10;
  bool notification_email = 11;
  bool notification_sms = 12;
  bool notification_push = 13;
  string language = 14;
  string currency = 15;
  string timezone = 16;
}

message ChangePasswordRequest {
  string access_token = 1;
  string current_password = 2;
  string new_password = 3;
  string new_password_confirmation = 4;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordRequest {
  string token = 1;
  string email = 2;
  string password = 3;
  string password_confirmation = 4;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message VerifyEmailRequest {
  string token = 1;
  string email = 2;
}

message VerifyEmailResponse {
  bool success = 1;
  string message = 2;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {
  bool success = 1;
  string message = 2;
}

message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string avatar = 5;
  string email_verified_at = 6;
  string address = 7;
  string city = 8;
  string province = 9;
  string postal_code = 10;
  string date_of_birth = 11;
  string gender = 12;
  repeated string roles = 13;
  bool notification_email = 14;
  bool notification_sms = 15;
  bool notification_push = 16;
  string language = 17;
  string currency = 18;
  string timezone = 19;
  string created_at = 20;
  string updated_at = 21;
}

message UserProfile {
  int32 order_count = 1;
  int32 review_count = 2;
  int32 wishlist_count = 3;
  double total_spent = 4;
  Category favorite_category = 5;
  string joined_at = 6;
}

message Category {
  int64 id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string image_url = 5;
  bool is_active = 6;
  string created_at = 7;
}