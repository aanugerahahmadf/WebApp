syntax = "proto3";

package weddingapp.order;

import "proto/auth.proto";
import "proto/catalog.proto";
import "proto/package.proto";

option php_namespace = "App\\Grpc\\Order";
option java_package = "com.weddingapp.order";
option csharp_namespace = "WeddingApp.Order";
option go_package = "github.com/weddingapp/grpc/order";

service OrderService {
  rpc GetOrder (GetOrderRequest) returns (OrderResponse);
  rpc GetOrders (GetOrdersRequest) returns (OrdersResponse);
  rpc GetMyOrders (GetMyOrdersRequest) returns (OrdersResponse);
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (OrderResponse);
  rpc UpdatePaymentStatus (UpdatePaymentStatusRequest) returns (OrderResponse);
  rpc CancelOrder (CancelOrderRequest) returns (OrderResponse);
  rpc Reorder (ReorderRequest) returns (OrderResponse);
  rpc GetOrderTimeline (GetOrderTimelineRequest) returns (OrderTimelineResponse);
  rpc GetOrderStats (GetOrderStatsRequest) returns (OrderStatsResponse);
  rpc ProcessPayment (ProcessPaymentRequest) returns (PaymentResultResponse);
  rpc RequestRefund (RequestRefundRequest) returns (RefundResponse);
}

message GetOrderRequest {
  string access_token = 1;
  int64 id = 2;
}

message GetOrdersRequest {
  string access_token = 1;
  int32 page = 2;
  int32 per_page = 3;
  string status = 4;
  string payment_status = 5;
  int64 user_id = 6;
  string date_from = 7;
  string date_to = 8;
}

message GetMyOrdersRequest {
  string access_token = 1;
  int32 page = 2;
  int32 per_page = 3;
  string status = 4;
}

message CreateOrderRequest {
  string access_token = 1;
  int64 catalog_id = 2;
  int64 package_id = 3;
  int32 quantity = 4;
  string booking_date = 5;
  string notes = 6;
  int64 address_id = 7;
  string voucher_code = 8;
  string payment_method = 9;
  map<string, string> custom_options = 10;
}

message UpdateOrderStatusRequest {
  string access_token = 1;
  int64 id = 2;
  string status = 3;
}

message UpdatePaymentStatusRequest {
  string access_token = 1;
  int64 id = 2;
  string payment_status = 3;
}

message CancelOrderRequest {
  string access_token = 1;
  int64 id = 2;
  string reason = 3;
  string reason_detail = 4;
}

message ReorderRequest {
  string access_token = 1;
  int64 order_id = 2;
}

message GetOrderTimelineRequest {
  string access_token = 1;
  int64 order_id = 2;
}

message GetOrderStatsRequest {
  string access_token = 1;
}

message ProcessPaymentRequest {
  string access_token = 1;
  int64 order_id = 2;
  map<string, string> payment_data = 3;
}

message RequestRefundRequest {
  string access_token = 1;
  int64 order_id = 2;
  string reason = 3;
  double amount = 4;
  repeated string evidence_photos = 5;
}

message OrderResponse {
  Order order = 1;
  string message = 2;
}

message OrdersResponse {
  repeated Order orders = 1;
  PaginationMeta pagination = 2;
}

message OrderTimelineResponse {
  repeated OrderTimeline timeline = 1;
}

message OrderStatsResponse {
  OrderStats stats = 1;
}

message PaymentResultResponse {
  bool success = 1;
  Order order = 2;
  string redirect_url = 3;
  string message = 4;
}

message RefundResponse {
  RefundRequest refund = 1;
}

message Order {
  int64 id = 1;
  string order_number = 2;
  int64 user_id = 3;
  int64 catalog_id = 4;
  int64 package_id = 5;
  double total_price = 6;
  string status = 7;
  string payment_status = 8;
  string booking_date = 9;
  int32 quantity = 10;
  string notes = 11;
  Address address = 12;
  Voucher voucher = 13;
  Payment payment = 14;
  repeated OrderTimeline timeline = 15;
  string created_at = 16;
  string updated_at = 17;
}

message Address {
  int64 id = 1;
  string name = 2;
  string phone = 3;
  string address = 4;
  string city = 5;
  string province = 6;
  string postal_code = 7;
  bool is_default = 8;
}

message Voucher {
  int64 id = 1;
  string code = 2;
  string name = 3;
  double discount_amount = 4;
  string discount_type = 5;
}

message Payment {
  int64 id = 1;
  string method = 2;
  string status = 3;
  double amount = 4;
  string paid_at = 5;
  string transaction_id = 6;
  string proof_url = 7;
}

message OrderTimeline {
  int64 id = 1;
  int64 order_id = 2;
  string status = 3;
  string description = 4;
  map<string, string> metadata = 5;
  string created_at = 6;
  User created_by = 7;
}

message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
}

message OrderStats {
  int32 total_orders = 1;
  int32 pending_orders = 2;
  int32 confirmed_orders = 3;
  int32 processing_orders = 4;
  int32 shipped_orders = 5;
  int32 delivered_orders = 6;
  int32 cancelled_orders = 7;
  double total_revenue = 8;
  double pending_revenue = 9;
  double this_month_revenue = 10;
  double average_order_value = 11;
  repeated StatusCount by_status = 12;
  repeated PaymentStatusCount by_payment_status = 13;
}

message StatusCount {
  string status = 1;
  int32 count = 2;
}

message PaymentStatusCount {
  string payment_status = 1;
  int32 count = 2;
}

message RefundRequest {
  int64 id = 1;
  int64 order_id = 2;
  string reason = 3;
  double amount = 4;
  string status = 5;
  string requested_at = 6;
  string processed_at = 7;
}

message PaginationMeta {
  int32 current_page = 1;
  int32 per_page = 2;
  int32 total = 3;
  int32 last_page = 4;
  int32 from = 5;
  int32 to = 6;
  bool has_next_page = 7;
  bool has_prev_page = 8;
}