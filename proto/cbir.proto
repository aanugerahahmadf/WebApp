syntax = "proto3";

package weddingapp.cbir;

import "proto/auth.proto";
import "proto/catalog.proto";
import "proto/package.proto";

option php_namespace = "App\\Grpc\\Cbir";
option java_package = "com.weddingapp.cbir";
option csharp_namespace = "WeddingApp.Cbir";
option go_package = "github.com/weddingapp/grpc/cbir";

service CbirService {
  rpc Search (CbirSearchRequest) returns (CbirSearchResponse);
  rpc GetStats (CbirStatsRequest) returns (CbirStatsResponse);
  rpc AddToIndex (AddToIndexRequest) returns (AddToIndexResponse);
  rpc RemoveFromIndex (RemoveFromIndexRequest) returns (RemoveFromIndexResponse);
  rpc GetHistory (GetHistoryRequest) returns (CbirHistoryResponse);
  rpc SaveSearch (SaveSearchRequest) returns (CbirSearchHistoryResponse);
  rpc DeleteSearch (DeleteSearchRequest) returns (DeleteSearchResponse);
  rpc ClearHistory (ClearHistoryRequest) returns (ClearHistoryResponse);
  rpc SubmitFeedback (SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
  rpc RebuildIndex (RebuildIndexRequest) returns (CbirIndexResponse);
}

message CbirSearchRequest {
  string access_token = 1;
  bytes image_data = 2;
  int32 limit = 3;
  double min_similarity = 4;
  bool rerank = 5;
}

message CbirSearchResponse {
  repeated CbirResult results = 1;
  double search_time = 2;
  int32 total_results = 3;
  string error = 4;
}

message CbirStatsRequest {
  string access_token = 1;
}

message CbirStatsResponse {
  int32 total_images = 1;
  int32 total_features = 2;
  string database_size = 3;
  string last_updated = 4;
  string status = 5;
  string message = 6;
}

message AddToIndexRequest {
  string access_token = 1;
  int64 media_id = 2;
  string image_path = 3;
  map<string, string> metadata = 4;
}

message AddToIndexResponse {
  bool success = 1;
  string message = 2;
  int64 entry_id = 3;
}

message RemoveFromIndexRequest {
  string access_token = 1;
  int64 media_id = 2;
}

message RemoveFromIndexResponse {
  bool success = 1;
  string message = 2;
  int32 removed = 3;
}

message GetHistoryRequest {
  string access_token = 1;
  int32 page = 2;
  int32 per_page = 3;
}

message CbirHistoryResponse {
  repeated CbirSearchHistory history = 1;
  PaginationMeta pagination = 2;
}

message SaveSearchRequest {
  string access_token = 1;
  string query_image_url = 2;
  repeated CbirSearchResultItem results = 3;
}

message CbirSearchResultItem {
  string type = 1; // "catalog" or "package"
  int64 item_id = 2;
  double similarity = 3;
  double score = 4;
}

message CbirSearchHistoryResponse {
  CbirSearchHistory history = 1;
}

message CbirSearchHistory {
  int64 id = 1;
  int64 user_id = 2;
  string query_image_url = 3;
  repeated CbirHistoryResult results = 4;
  int32 results_count = 5;
  double top_similarity = 6;
  string created_at = 7;
}

message CbirHistoryResult {
  string type = 1;
  int64 item_id = 2;
  double similarity = 3;
  double score = 4;
  CbirResultData item = 5;
}

message DeleteSearchRequest {
  string access_token = 1;
  int64 search_id = 2;
}

message DeleteSearchResponse {
  bool success = 1;
  string message = 2;
}

message ClearHistoryRequest {
  string access_token = 1;
}

message ClearHistoryResponse {
  bool success = 1;
  string message = 2;
}

message SubmitFeedbackRequest {
  string access_token = 1;
  int64 search_id = 2;
  int64 item_id = 3;
  string item_type = 4;
  bool is_relevant = 5;
  string feedback = 6;
}

message SubmitFeedbackResponse {
  bool success = 1;
  string message = 2;
}

message RebuildIndexRequest {
  string access_token = 1;
}

message CbirIndexResponse {
  bool success = 1;
  string message = 2;
  int32 affected_count = 3;
  double processing_time = 4;
}

message CbirResult {
  string type = 1;
  double similarity = 2;
  double score = 3;
  CbirResultData data = 4;
}

message CbirResultData {
  int64 id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  double price = 5;
  double discount_price = 6;
  double final_price = 7;
  string image_url = 8;
  string category = 9;
  Category category_obj = 10;
  bool is_available = 11;
}

message Category {
  int64 id = 1;
  string name = 2;
  string slug = 3;
  string image_url = 4;
}

message PaginationMeta {
  int32 current_page = 1;
  int32 per_page = 2;
  int32 total = 3;
  int32 last_page = 4;
  int32 from = 5;
  int32 to = 6;
  bool has_next_page = 7;
  bool has_prev_page = 8;
}