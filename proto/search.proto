syntax = "proto3";

package weddingapp.search;

import "proto/auth.proto";
import "proto/catalog.proto";
import "proto/package.proto";

option php_namespace = "App\\Grpc\\Search";
option java_package = "com.weddingapp.search";
option csharp_namespace = "WeddingApp.Search";
option go_package = "github.com/weddingapp/grpc/search";

service SearchService {
  rpc Search (SearchRequest) returns (SearchResponse);
  rpc GetSuggestions (GetSuggestionsRequest) returns (SuggestionsResponse);
  rpc GetPopularSearches (GetPopularSearchesRequest) returns (PopularSearchesResponse);
  rpc GetFilters (GetFiltersRequest) returns (FiltersResponse);
}

message SearchRequest {
  string access_token = 1;
  string query = 2;
  SearchType type = 3;
  int32 limit = 4;
  int64 category_id = 5;
  double min_price = 6;
  double max_price = 7;
}

message GetSuggestionsRequest {
  string access_token = 1;
  string query = 2;
  int32 limit = 3;
}

message GetPopularSearchesRequest {
  string access_token = 1;
  int32 limit = 2;
}

message GetFiltersRequest {
  string access_token = 1;
  string query = 2;
  int64 category_id = 3;
}

message SearchResponse {
  SearchResults results = 1;
}

message SearchResults {
  repeated weddingapp.catalog.Catalog catalogs = 1;
  repeated weddingapp.package.Package packages = 2;
  repeated weddingapp.catalog.Category categories = 3;
  int32 total_catalogs = 4;
  int32 total_packages = 5;
  string query = 6;
  double took_ms = 7;
}

message SuggestionsResponse {
  repeated SearchSuggestion suggestions = 1;
}

message SearchSuggestion {
  string text = 1;
  SuggestionType type = 2;
  int32 count = 3;
  string image_url = 4;
}

message PopularSearchesResponse {
  repeated PopularSearch searches = 1;
}

message PopularSearch {
  string query = 1;
  int32 count = 2;
  string trend = 3;
}

message FiltersResponse {
  SearchFilters filters = 1;
}

message SearchFilters {
  repeated CategoryFilter categories = 1;
  PriceRange price_range = 2;
  repeated string themes = 3;
  repeated string colors = 4;
  int32 min_capacity = 5;
  int32 max_capacity = 6;
}

message CategoryFilter {
  weddingapp.catalog.Category category = 1;
  int32 count = 2;
}

message PriceRange {
  double min = 1;
  double max = 2;
  double min_found = 3;
  double max_found = 4;
}

enum SearchType {
  SEARCH_TYPE_UNSPECIFIED = 0;
  CATALOG = 1;
  PACKAGE = 2;
  BOTH = 3;
}

enum SuggestionType {
  SUGGESTION_TYPE_UNSPECIFIED = 0;
  CATALOG = 1;
  PACKAGE = 2;
  CATEGORY = 3;
  KEYWORD = 4;
}