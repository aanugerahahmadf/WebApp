syntax = "proto3";

package weddingapp.wishlist;

import "proto/auth.proto";
import "proto/catalog.proto";
import "proto/package.proto";

option php_namespace = "App\\Grpc\\Wishlist";
option java_package = "com.weddingapp.wishlist";
option csharp_namespace = "WeddingApp.Wishlist";
option go_package = "github.com/weddingapp/grpc/wishlist";

service WishlistService {
  rpc GetWishlist (GetWishlistRequest) returns (WishlistResponse);
  rpc ToggleWishlist (ToggleWishlistRequest) returns (WishlistActionResponse);
  rpc AddToWishlist (AddToWishlistRequest) returns (WishlistItemResponse);
  rpc RemoveFromWishlist (RemoveFromWishlistRequest) returns (RemoveFromWishlistResponse);
  rpc ClearWishlist (ClearWishlistRequest) returns (ClearWishlistResponse);
  rpc IsInWishlist (IsInWishlistRequest) returns (IsInWishlistResponse);
  rpc MoveToCart (MoveToCartRequest) returns (weddingapp.cart.CartItemResponse);
  rpc ShareWishlist (ShareWishlistRequest) returns (ShareWishlistResponse);
}

message GetWishlistRequest {
  string access_token = 1;
  int32 page = 2;
  int32 per_page = 3;
}

message ToggleWishlistRequest {
  string access_token = 1;
  int64 catalog_id = 2;
  int64 package_id = 3;
}

message AddToWishlistRequest {
  string access_token = 1;
  int64 catalog_id = 2;
  int64 package_id = 3;
}

message RemoveFromWishlistRequest {
  string access_token = 1;
  int64 wishlist_id = 2;
}

message ClearWishlistRequest {
  string access_token = 1;
}

message IsInWishlistRequest {
  string access_token = 1;
  int64 catalog_id = 2;
  int64 package_id = 3;
}

message MoveToCartRequest {
  string access_token = 1;
  int64 wishlist_id = 2;
  int32 quantity = 3;
}

message ShareWishlistRequest {
  string access_token = 1;
}

message WishlistResponse {
  repeated WishlistItem items = 1;
  PaginationMeta pagination = 2;
}

message WishlistActionResponse {
  WishlistItem wishlist = 1;
  WishlistActionType action = 2;
  string message = 3;
}

message WishlistItemResponse {
  WishlistItem item = 1;
  string message = 2;
}

message RemoveFromWishlistResponse {
  bool success = 1;
  string message = 2;
}

message ClearWishlistResponse {
  bool success = 1;
  string message = 2;
}

message IsInWishlistResponse {
  bool in_wishlist = 1;
}

message ShareWishlistResponse {
  string share_token = 1;
  string share_url = 2;
  string expires_at = 3;
}

message WishlistItem {
  int64 id = 1;
  int64 user_id = 2;
  int64 catalog_id = 3;
  int64 package_id = 4;
  weddingapp.catalog.Catalog catalog = 5;
  weddingapp.package.Package package = 6;
  string created_at = 7;
}

enum WishlistActionType {
  WISHLIST_ACTION_TYPE_UNSPECIFIED = 0;
  ADDED = 1;
  REMOVED = 2;
}

message PaginationMeta {
  int32 current_page = 1;
  int32 per_page = 2;
  int32 total = 3;
  int32 last_page = 4;
  int32 from = 5;
  int32 to = 6;
  bool has_next_page = 7;
  bool has_prev_page = 8;
}