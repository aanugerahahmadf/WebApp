syntax = "proto3";

package wedding.user.v1;

option go_package = "github.com/wedding/user/v1;userv1";
option php_namespace = "App\\Grpc\\User\\V1";
option php_metadata_namespace = "App\\Grpc\\User\\V1\\GPBMetadata";

import "wedding/user/v1/common.proto";
import "wedding/user/v1/auth.proto";
import "wedding/user/v1/catalog.proto";
import "wedding/user/v1/package.proto";
import "wedding/user/v1/voucher.proto";

// Order Service
service OrderService {
  rpc GetMyOrders(GetMyOrdersRequest) returns (OrderListResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc GetOrderByNumber(GetOrderByNumberRequest) returns (Order);
  rpc GetOrders(GetOrdersRequest) returns (OrderListResponse);
  rpc GetOrderStats(GetOrderStatsRequest) returns (OrderStats);
  rpc GetOrderTimeline(GetOrderTimelineRequest) returns (OrderTimelineResponse);
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc CancelOrder(CancelOrderRequest) returns (Order);
  rpc Reorder(ReorderRequest) returns (Order);
  rpc UpdateOrder(UpdateOrderRequest) returns (Order);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (Order);
  rpc UpdatePaymentStatus(UpdatePaymentStatusRequest) returns (Order);
  rpc ProcessPayment(ProcessPaymentRequest) returns (PaymentResult);
  rpc RequestRefund(RequestRefundRequest) returns (RefundRequestResponse);
}

message GetMyOrdersRequest {
  PaginationRequest pagination = 1;
  string status = 2;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderByNumberRequest {
  string order_number = 1;
}

message GetOrdersRequest {
  PaginationRequest pagination = 1;
  string status = 2;
  string payment_status = 3;
  string user_id = 4;
  string date_from = 5;
  string date_to = 6;
}

message GetOrderStatsRequest {}

message GetOrderTimelineRequest {
  string order_id = 1;
}

message CreateOrderRequest {
  string catalog_id = 1;
  string package_id = 2;
  int32 quantity = 3;
  string booking_date = 4;
  string notes = 5;
  string address_id = 6;
  string voucher_code = 7;
  PaymentMethod payment_method = 8;
  MetaData custom_options = 9;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
  string reason_detail = 3;
}

message ReorderRequest {
  string order_id = 1;
}

message UpdateOrderRequest {
  string order_id = 1;
  OrderStatus status = 2;
  PaymentStatus payment_status = 3;
  string notes = 4;
  string tracking_number = 5;
  string estimated_delivery = 6;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  OrderStatus status = 2;
}

message UpdatePaymentStatusRequest {
  string order_id = 1;
  PaymentStatus payment_status = 2;
}

message ProcessPaymentRequest {
  string order_id = 1;
  MetaData payment_data = 2;
}

message RequestRefundRequest {
  string order_id = 1;
  string reason = 2;
  double amount = 3;
}

message OrderListResponse {
  repeated Order orders = 1;
  PaginationResponse pagination = 2;
}

message OrderTimelineResponse {
  repeated OrderTimeline timeline = 1;
}

message OrderStats {
  int32 total_orders = 1;
  int32 pending_orders = 2;
  int32 confirmed_orders = 3;
  int32 processing_orders = 4;
  int32 shipped_orders = 5;
  int32 delivered_orders = 6;
  int32 cancelled_orders = 7;
  double total_revenue = 8;
  double pending_revenue = 9;
  double this_month_revenue = 10;
  double average_order_value = 11;
  repeated OrderStatusCount by_status = 12;
  repeated OrderPaymentStatusCount by_payment_status = 13;
}

message Order {
  string id = 1;
  string order_number = 2;
  User user = 3;
  Package package = 4;
  Catalog catalog = 5;
  double total_price = 6;
  string status = 7;
  string payment_status = 8;
  string booking_date = 9;
  int32 quantity = 10;
  string notes = 11;
  OrderAddress address = 12;
  Voucher voucher = 13;
  OrderPayment payment = 14;
  repeated OrderTimeline timeline = 15;
  string created_at = 16;
  string updated_at = 17;
}

message OrderAddress {
  string id = 1;
  string name = 2;
  string phone = 3;
  string address = 4;
  string city = 5;
  string province = 6;
  string postal_code = 7;
  bool is_default = 8;
}

message OrderPayment {
  string id = 1;
  string method = 2;
  string status = 3;
  double amount = 4;
  string paid_at = 5;
  string transaction_id = 6;
  string proof_url = 7;
}

message OrderTimeline {
  string id = 1;
  string order_id = 2;
  string status = 3;
  string description = 4;
  MetaData metadata = 5;
  string created_at = 6;
  User created_by = 7;
}

message OrderStatusCount {
  string status = 1;
  int32 count = 2;
}

message OrderPaymentStatusCount {
  string payment_status = 1;
  int32 count = 2;
}

message PaymentResult {
  bool success = 1;
  Order order = 2;
  string redirect_url = 3;
  string message = 4;
}

message RefundRequestResponse {
  string id = 1;
  Order order = 2;
  string reason = 3;
  double amount = 4;
  RefundStatus status = 5;
  string requested_at = 6;
  string processed_at = 7;
}

message Invoice {
  string id = 1;
  Order order = 2;
  string invoice_number = 3;
  string pdf_url = 4;
  string issued_at = 5;
  string due_at = 6;
  string status = 7;
}