syntax = "proto3";

package wedding.user.v1;

option go_package = "github.com/wedding/user/v1;userv1";
option php_namespace = "App\\Grpc\\User\\V1";
option php_metadata_namespace = "App\\Grpc\\User\\V1\\GPBMetadata";

import "wedding/user/v1/common.proto";
import "wedding/user/v1/auth.proto";

// Notification Service
service NotificationService {
  rpc GetNotifications(GetNotificationsRequest) returns (NotificationListResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (UnreadCountResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc MarkAllAsRead(MarkAllAsReadRequest) returns (MarkAllAsReadResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
  // Streaming for real-time notifications
  rpc WatchNotifications(WatchNotificationsRequest) returns (stream Notification);
}

message GetNotificationsRequest {
  PaginationRequest pagination = 1;
  bool unread_only = 2;
}

message NotificationListResponse {
  repeated Notification notifications = 1;
  PaginationResponse pagination = 2;
}

message GetUnreadCountRequest {}

message UnreadCountResponse {
  int32 count = 1;
}

message MarkAsReadRequest {
  string notification_id = 1;
}

message MarkAsReadResponse {
  bool success = 1;
  string message = 2;
}

message MarkAllAsReadRequest {}

message MarkAllAsReadResponse {
  bool success = 1;
  int32 marked_count = 2;
  string message = 3;
}

message DeleteNotificationRequest {
  string notification_id = 1;
}

message DeleteNotificationResponse {
  bool success = 1;
  string message = 2;
}

message WatchNotificationsRequest {
  string user_id = 1;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string title = 4;
  string message = 5;
  MetaData data = 6;
  bool is_read = 7;
  string read_at = 8;
  string created_at = 9;
}