syntax = "proto3";

package wedding.user.v1;

option go_package = "github.com/wedding/user/v1;userv1";
option php_namespace = "App\\Grpc\\User\\V1";
option php_metadata_namespace = "App\\Grpc\\User\\V1\\GPBMetadata";

import "wedding/user/v1/common.proto";
import "wedding/user/v1/auth.proto";
import "wedding/user/v1/catalog.proto";
import "wedding/user/v1/package.proto";
import "wedding/user/v1/cart.proto";

// Favorite Service
service Favoriteservice {
  rpc GetMyFavorite(GetMyFavoriteRequest) returns (FavoriteListResponse);
  rpc IsInFavorite(IsInFavoriteRequest) returns (IsInFavoriteResponse);
  rpc ToggleFavorite(ToggleFavoriteRequest) returns (FavoriteActionResponse);
  rpc AddToFavorite(AddToFavoriteRequest) returns (Favorite);
  rpc RemoveFromFavorite(RemoveFromFavoriteRequest) returns (RemoveFromFavoriteResponse);
  rpc ClearFavorite(ClearFavoriteRequest) returns (ClearFavoriteResponse);
  rpc MoveToCart(MoveToCartRequest) returns (CartItem);
  rpc ShareFavorite(ShareFavoriteRequest) returns (Favoriteshare);
}

message GetMyFavoriteRequest {
  PaginationRequest pagination = 1;
}

message IsInFavoriteRequest {
  string catalog_id = 1;
  string package_id = 2;
}

message ToggleFavoriteRequest {
  string catalog_id = 1;
  string package_id = 2;
}

message AddToFavoriteRequest {
  string catalog_id = 1;
  string package_id = 2;
}

message RemoveFromFavoriteRequest {
  string favorite_id = 1;
}

message ClearFavoriteRequest {}

message MoveToCartRequest {
  string favorite_id = 1;
  int32 quantity = 2;
}

message ShareFavoriteRequest {}

message FavoriteListResponse {
  repeated Favorite favorite = 1;
  PaginationResponse pagination = 2;
}

message Favorite {
  string id = 1;
  User user = 2;
  Catalog catalog = 3;
  Package package = 4;
  string created_at = 5;
}

message IsInFavoriteResponse {
  bool in_Favorite = 1;
}

message FavoriteActionResponse {
  Favorite favorite = 1;
  FavoriteActionType action = 2;
  string message = 3;
}

message RemoveFromFavoriteResponse {
  bool success = 1;
  string message = 2;
}

message ClearFavoriteResponse {
  bool success = 1;
  string message = 2;
}

message Favoriteshare {
  string share_token = 1;
  string share_url = 2;
  string expires_at = 3;
}
