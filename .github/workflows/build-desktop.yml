name: Build desktop assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build desktop assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - name: Verify build output
        run: test -f public/build/desktop/.vite/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-assets
          path: public/build/desktop
          if-no-files-found: error
          retention-days: 7
