name: Build mobile assets

on:
  workflow_dispatch:
    inputs:
      target:
        description: Mobile target
        required: true
        default: android
        type: choice
        options: [android, ios]

permissions:
  contents: read

jobs:
  build:
    name: Build mobile assets (${{ inputs.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:mobile:${{ inputs.target }}
      - name: Verify build output
        run: test -f public/build/mobile/.vite/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-assets-${{ inputs.target }}
          path: public/build/mobile
          if-no-files-found: error
          retention-days: 7
