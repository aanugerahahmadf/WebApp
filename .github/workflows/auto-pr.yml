name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    name: Create or update PR to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR to main if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"

          # Skip if branch has no commits ahead of main
          git fetch origin main
          AHEAD="$(git rev-list --count "origin/main..HEAD" || echo 0)"
          if [ "$AHEAD" -eq 0 ]; then
            echo "No commits ahead of main; skipping PR."
            exit 0
          fi

          EXISTING="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            TITLE="$(git log -1 --pretty=%s)"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "Automated PR from branch \`$BRANCH\` to \`main\`." || {
              echo "PR create failed (may already exist or no diff)."
              exit 0
            }
            EXISTING="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          else
            echo "Open PR #$EXISTING already exists for $BRANCH."
          fi

          if [ -n "$EXISTING" ]; then
            # Enable auto-merge when checks pass (requires repo auto-merge setting).
            gh pr merge "$EXISTING" --auto --merge || echo "Could not enable auto-merge (repo setting may be disabled); PR left open."
          fi
