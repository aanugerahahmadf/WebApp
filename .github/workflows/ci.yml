name: Continuous integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Boot Laravel application
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:qlfLQwBtJA/blNrn3/qZ8T3NZYaj9cSHCPI88Ldmelo=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, grpc
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Create Laravel runtime directories
        run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
      - name: Verify Laravel can boot
        run: php artisan about --only=environment
      - name: Verify application routes load
        run: php artisan route:list --json > /dev/null

  # Suite PHP tidak pernah jalan di CI sebelumnya: 79 file / ~721 test closure
  # hanya dieksekusi kalau developers ingat. Job ini menutup celah itu.
  phpunit:
    name: PHP test suite
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:qlfLQwBtJA/blNrn3/qZ8T3NZYaj9cSHCPI88Ldmelo=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BCRYPT_ROUNDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # grpc WAJIB ada di sini, sama seperti di job `application` dan
          # `frontend`. `google/cloud-firestore` (v2.1.0 di composer.lock)
          # mendeklarasikan `ext-grpc` di require-nya, jadi `composer install`
          # berhenti dengan "your lock file does not contain a compatible set of
          # packages" kalau ekstensi ini tidak ada -- meski tidak ada satu pun
          # test di suite ini yang benar-benar memanggil Firestore.
          #
          # FirestoreServiceTest memang skip sendiri saat kredensial tidak ada,
          # tapi itu alasan untuk TIDAK stumbling, bukan alasan memasang
          # ekstensi: menyandarkan installer pada skip-test berarti lock file
          # dan platform CI tidak sinkron, dan begitu ada test yang menyentuh
          # Firestore tanpa kredensial, kegagalan muncul sebagai error yang
          # tidak jelas.
          extensions: mbstring, pdo_sqlite, sqlite3, grpc
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Create Laravel runtime directories
        run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
      - name: Run Unit suite
        run: php artisan test --testsuite=Unit
      - name: Run Integration suite
        run: php artisan test --testsuite=Integration
      - name: Run Feature suite
        run: php artisan test --testsuite=Feature

  # Kontrak `reason`/`reason_code` dari /api/ktp/verify diuji di
  # ai-scan-coach.test.js, tapi tidak ada workflow yang pernah memanggilnya.
  ai-scan-coach:
    name: AI scan coach contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run node --test for the scan coach
        run: node --test resources/js/ai-scan-coach/

  frontend:
    name: Build web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: grpc
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: test -f public/build/web/.vite/manifest.json
