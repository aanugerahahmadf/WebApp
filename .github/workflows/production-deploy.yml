name: Deploy Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GCP_SERVICE_KEY: ${{ secrets.GCP_SERVICE_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$GCP_SERVICE_KEY" ] && [ -n "$GCP_PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: configure GCP_SERVICE_KEY and GCP_PROJECT_ID first.'
          fi
  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          IMAGE="gcr.io/$PROJECT_ID/wedding-decorasi-api:${{ github.sha }}"
          gcloud auth configure-docker gcr.io --quiet
          docker build --file Dockerfile.cloudrun --tag "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy wedding-decorasi-api --image "$IMAGE" --project "$PROJECT_ID" --region asia-southeast2 --platform managed --allow-unauthenticated --set-env-vars "APP_ENV=production,APP_DEBUG=false,APP_KEY=$APP_KEY"
